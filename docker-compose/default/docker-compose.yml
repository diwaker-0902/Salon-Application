        container_name: serviceoffering
        restart: unless-stopped

        depends_on:
            serviceofferingdb:
                condition: service_healthy

            eurekaserver:
                condition: service_healthy

        environment:
            SPRING_APPLICATION_NAME: "service-offering"
            SPRING_DATASOURCE_URL: jdbc:mysql://serviceofferingdb:3306/salon_service_offering_db?createDatabaseIfNotExist=true
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_PASSWORD: root
            SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
            SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
            SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: 30000
            SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 600000
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/

            JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m"

        # deploy:
        #     resources:
        #         limits:
        #             memory: 700m
        mem_limit: 256m

        networks:
            - salon-network










    


    gatewayserver:
        image: "diwaker0902/salon-gateway-server:v1"
        container_name: gatewayserver
        restart: unless-stopped

        ports:
            - "5000:5000"

        healthcheck:
            test: ["CMD-SHELL", "curl --fail --silent gatewayserver:5000/actuator/health/readiness | grep UP || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

        depends_on:
            eurekaserver:
                condition: service_healthy

        environment:
            SPRING_APPLICATION_NAME: "gateway-server"
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/

            # JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m"
            JAVA_TOOL_OPTIONS: "-Xms32m -Xmx96m"

        # deploy:
        #     resources:
        #         limits:
        #             memory: 700m
        mem_limit: 256m

        networks:
            - salon-network




networks:
  salon-network:
    driver: bridge
            
# Docker Compose file (docker-compose.yml or compose.yaml), not a Dockerfile. 
# A Dockerfile contains instructions like FROM, COPY, RUN, etc., 
# whereas services:, networks:, and ports: belong to Docker Compose.




# Everything under services represents one Docker container.