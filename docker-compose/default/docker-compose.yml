            eurekaserver:
                condition: service_healthy

        environment:
            SPRING_APPLICATION_NAME: "salon-service"
            SPRING_DATASOURCE_URL: jdbc:mysql://salondb:3306/salon_service_db?createDatabaseIfNotExist=true
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_PASSWORD: root
            SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
            SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
            SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: 30000
            SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 600000
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/

            JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m"

        # deploy:
        #     resources:
        #         limits:
        #             memory: 700m
        mem_limit: 384m

        networks:
            - salon-network



    serviceoffering:
        image: "diwaker0902/salon-service-offering:v1"
        ports:
